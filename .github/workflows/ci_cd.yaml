# CI: проверка стиля, тесты, сборка Docker-образа (и публикация в GHCR при push).
#
#   lint  ──┐
#           ├──►  build  (на push: образ публикуется в ghcr.io; на pull_request: только сборка)
#   test  ──┘
name: CI/CD

on:
  push:
    branches: [develop, feature/docker_ci_cd]
  pull_request:
    branches: [develop]

# Права по умолчанию минимальные; job build расширяет их до записи пакетов
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.4.3"
  # Имя образа строго в нижнем регистре (требование реестра), поэтому задано явно
  IMAGE_NAME: ghcr.io/konstantinostsiakkuri/habit_tracker

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Poetry ставится до setup-python: действие использует его для вычисления ключа кэша
      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: flake8
        run: poetry run flake8 .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest

    # PostgreSQL как service-контейнер: тестам нужна настоящая БД (pytest-django создаёт test_<DB_NAME>)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Тестовые значения: это не секреты (БД живёт только на время job). Redis тестам не нужен:
    # Celery-задачи вызываются напрямую, а сеть Telegram замокана.
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: habit_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_API_URL: https://api.telegram.org
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root

      # Порог покрытия (fail_under = 80) задан в pyproject.toml: ниже 80 % pytest завершается ошибкой
      - name: pytest
        run: poetry run pytest --cov-report=term-missing

  build:
    name: Build Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Вход в реестр нужен только для публикации (push); для pull_request образ лишь собирается
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: latest и полный sha коммита. Метки (labels) включают org.opencontainers.image.source,
      # по которой GitHub связывает пакет с репозиторием
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв в хранилище GitHub Actions: повторные сборки не скачивают зависимости заново
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Без provenance-аттестаций в реестре остаются только нужные теги
          provenance: false

  deploy:
    name: Deploy to server
    needs: build
    # Только на push (ветки уже ограничены триггером workflow): на pull_request секреты не используются
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Первый деплой на слабой ВМ долгий (скачивание образов, миграции), поэтому запас по времени
    timeout-minutes: 30
    # Два деплоя одновременно недопустимы: второй ждёт первого, а не отменяет его на середине
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      # Сервер запускает ровно тот образ, который собран из этого коммита
      APP_IMAGE: ghcr.io/konstantinostsiakkuri/habit_tracker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # Секреты передаются через env (а не вставляются в команду): GitHub маскирует их значения в логах
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config
          ssh server 'echo "SSH OK: $(whoami)@$(hostname)"'

      - name: Copy compose and nginx config
        run: |
          ssh server 'mkdir -p ~/habit_tracker/nginx'
          scp docker-compose.yaml server:habit_tracker/docker-compose.yaml
          scp nginx/nginx.conf server:habit_tracker/nginx/nginx.conf

      # .env собирается из секрета прямо на сервере (через stdin: значения не попадают в аргументы команд и логи).
      # В конец дописывается APP_IMAGE: так compose берёт нужный образ и при ручном запуске на сервере
      - name: Write .env on server
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          { printf '%s\n' "$ENV_FILE"; printf 'APP_IMAGE=%s\n' "$APP_IMAGE"; } \
            | ssh server 'umask 077 && cat > ~/habit_tracker/.env && chmod 600 ~/habit_tracker/.env'

      # Вход в ghcr.io токеном job; пароль передаётся через stdin (не виден в списке процессов)
      - name: Log in to GHCR on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Pull images and restart services
        run: |
          ssh server 'cd ~/habit_tracker && docker compose pull && docker compose up -d --no-build --remove-orphans'
          ssh server 'docker image prune -f'

      # Ожидание готовности с повторными попытками (до ~7 минут): на слабой ВМ миграции идут долго
      - name: Smoke test
        run: |
          check() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$SSH_HOST$1" || true
          }
          for i in $(seq 1 40); do
            code=$(check /health/)
            echo "attempt $i: /health/ -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::/health/ не ответил 200"; exit 1; }
          for path in /api/docs/ /api/schema/ /static/admin/css/base.css; do
            code=$(check "$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path ответил $code"; exit 1; }
          done

      - name: Diagnostics on failure
        if: failure()
        run: |
          ssh server 'cd ~/habit_tracker && docker compose ps -a && docker compose logs --tail=100' || true

      # Токен на сервере не должен оставаться в ~/.docker/config.json
      - name: Log out from GHCR on server
        if: always()
        run: ssh server 'docker logout ghcr.io' || true
