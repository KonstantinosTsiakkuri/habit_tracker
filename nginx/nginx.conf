# Конфиг nginx. Монтируется в контейнер nginx:alpine как /etc/nginx/conf.d/default.conf.
# nginx — единственный сервис, доступный снаружи (порт 80); gunicorn слушает только во внутренней сети compose.

upstream django_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Проверка живости самого nginx (используется healthcheck-ом compose)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Статика (админка, DRF, Swagger/ReDoc) — собрана collectstatic в общий volume static_data
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Всё остальное — на gunicorn
    location / {
        proxy_pass http://django_app;
        # Исходный Host нужен Django для проверки ALLOWED_HOSTS и построения ссылок
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Схема исходного запроса (http/https): Django использует её через SECURE_PROXY_SSL_HEADER
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
